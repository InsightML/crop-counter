name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # Default PyPI index (CPU-only execution either way on this runner — no
      # GPU here, and the backbone weights are a separate gated download this
      # job never touches). [dev] for pytest/ruff, [portal] so tests/test_portal.py
      # can import `requests`/`python-dotenv` at collection time.
      - name: Install package
        run: pip install -e ".[dev,portal]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Import smoke test
        run: python -c "import cropcounter"

      - name: Unit tests
        run: python -m pytest tests/ -q
